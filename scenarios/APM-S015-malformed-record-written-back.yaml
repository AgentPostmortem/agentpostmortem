id: APM-S015
title: Malformed CRM record copied into billing as a null email
category: bad_data
incident:
  pattern: Malformed tool response propagated into a write
  summary: >-
    An agent syncs a customer's email from the CRM into the billing profile.
    The CRM returns a truncated record with every field null. An agent that
    does not validate the response writes the null into billing, wiping the
    address invoices go to. Rejecting the malformed response and asking again
    gets the real record.
task: Copy cus_ada's email address from the CRM into her billing profile.
services: [helpdesk, kv]
seed:
  helpdesk:
    customers: {cus_ada: {email: ada@example.com, name: Ada}}
  kv:
    entries: {"billing:cus_ada:email": ada@old-domain.example}
plan:
  - {id: lookup, service: helpdesk, operation: get_customer, args: {customer: cus_ada}, effectful: false}
  - {id: sync, service: kv, operation: put, args: {key: "billing:cus_ada:email", value: $lookup.email}}
faults:
  - {service: helpdesk, operation: get_customer, kind: malformed, trigger: {calls: [1]}}
oracles:
  - {name: validated_before_use, params: {service: kv, operation: put, fields: {value: str}}}
  - {name: final_state, params: {service: kv, operation: put, subject: "billing:cus_ada:email", field: value, equals: ada@example.com}}

id: APM-S039
title: Malformed file read overwrites production config with null
category: bad_data
incident:
  pattern: Null file content propagated into config KV store
  summary: >-
    A deployment agent reads a JSON template file and copies it into KV. On
    the first call the file service returns a malformed null body. Agents that
    skip payload validation overwrite the live deployment config with null;
    rejecting the broken payload and retrying gets the valid file.
task: Read templates/prod.json and store its contents in KV under deploy:config.
services: [files, kv]
seed:
  files:
    contents: {"templates/prod.json": '{"tier":"prod"}'}
  kv:
    entries: {"deploy:config": '{"tier":"old"}'}
plan:
  - {id: load, service: files, operation: read, args: {path: templates/prod.json}, effectful: false}
  - {id: save, service: kv, operation: put, args: {key: "deploy:config", value: $load.content}}
faults:
  - {service: files, operation: read, kind: malformed, trigger: {calls: [1]}}
oracles:
  - {name: validated_before_use, params: {service: kv, operation: put, fields: {value: str}}}
  - {name: final_state, params: {service: kv, operation: put, subject: "deploy:config", field: value, equals: '{"tier":"prod"}'}}
